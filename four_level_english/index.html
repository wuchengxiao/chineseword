<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四级词汇打字练习游戏</title>
    <!-- 引入独立词库文件 -->
    <script src="vocabulary.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .word-card {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }
        .word-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }
        .phonetic {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
            font-style: italic;
        }
        .translation {
            font-size: 1.3rem;
            color: #555;
            margin-bottom: 15px;
            text-align: center;
        }
        .example {
            font-size: 1rem;
            color: #777;
            font-style: italic;
            text-align: center;
            padding: 10px;
            background: white;
            border-radius: 8px;
        }
        .input-area {
            margin-bottom: 30px;
        }
        #typing-input {
            width: 100%;
            padding: 15px;
            font-size: 1.5rem;
            border: 3px solid #ddd;
            border-radius: 10px;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }
        #typing-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }
        .feedback {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 15px;
            min-height: 30px;
        }
        .correct {
            color: #28a745;
            font-weight: bold;
        }
        .wrong {
            color: #dc3545;
            font-weight: bold;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        #start-btn {
            background: #667eea;
            color: white;
        }
        #start-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        #restart-btn {
            background: #28a745;
            color: white;
        }
        #restart-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            margin-top: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width 0.3s;
        }
        .tip {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 四级词汇打字练习</h1>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="correct-count">0</div>
                <div class="stat-label">正确数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="wrong-count">0</div>
                <div class="stat-label">错误数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="current-index">1/20</div>
                <div class="stat-label">当前进度</div>
            </div>
        </div>

        <div class="word-card">
            <div class="word-display" id="word-display">点击开始按钮开始练习</div>
            <div class="phonetic" id="phonetic-display"></div>
            <div class="translation" id="translation-display"></div>
            <div class="example" id="example-display"></div>
        </div>

        <div class="input-area">
            <input type="text" id="typing-input" placeholder="在这里输入单词" disabled>
            <div class="feedback" id="feedback"></div>
        </div>

        <div class="controls">
            <button id="start-btn">开始练习</button>
            <button id="restart-btn" disabled>重新开始</button>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="tip">每次启动自动从全部词库中随机抽取20个单词进行练习</div>
    </div>

    <script>
        // 游戏状态变量
        const PRACTICE_WORD_COUNT = 20; // 固定练习单词数量
        let currentWordIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let shuffledWords = [];
        let isGameRunning = false;

        // DOM元素
        const wordDisplay = document.getElementById('word-display');
        const phoneticDisplay = document.getElementById('phonetic-display');
        const translationDisplay = document.getElementById('translation-display');
        const exampleDisplay = document.getElementById('example-display');
        const typingInput = document.getElementById('typing-input');
        const feedback = document.getElementById('feedback');
        const correctCountEl = document.getElementById('correct-count');
        const wrongCountEl = document.getElementById('wrong-count');
        const currentIndexEl = document.getElementById('current-index');
        const progressFill = document.getElementById('progress-fill');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // 打乱数组顺序
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // 从完整词库中随机抽取指定数量的不重复单词
        function getRandomWords(count) {
            // 先打乱全部词库，再取前count个，保证不重复
            const shuffledAll = shuffleArray(wordLibrary);
            return shuffledAll.slice(0, count);
        }

        // 显示当前单词
        function showCurrentWord() {
            if (currentWordIndex >= shuffledWords.length) {
                endGame();
                return;
            }
            const currentWord = shuffledWords[currentWordIndex];
            wordDisplay.textContent = currentWord.word;
            phoneticDisplay.textContent = currentWord.phonetic;
            translationDisplay.textContent = currentWord.translation;
            exampleDisplay.textContent = `"${currentWord.example}"`;
            typingInput.value = '';
            feedback.textContent = '';
            feedback.className = 'feedback';
            typingInput.focus();
            updateStats();
        }

        // 更新统计信息
        function updateStats() {
            correctCountEl.textContent = correctCount;
            wrongCountEl.textContent = wrongCount;
            currentIndexEl.textContent = `${currentWordIndex + 1}/${shuffledWords.length}`;
            progressFill.style.width = `${((currentWordIndex + 1) / shuffledWords.length) * 100}%`;
        }

        // 检查输入是否正确
        function checkInput() {
            const inputValue = typingInput.value.trim().toLowerCase();
            const currentWord = shuffledWords[currentWordIndex].word.toLowerCase();
            
            if (inputValue === currentWord) {
                feedback.textContent = "✅ 正确！太棒了！";
                feedback.className = "feedback correct";
                correctCount++;
                setTimeout(() => {
                    currentWordIndex++;
                    showCurrentWord();
                }, 800);
            } else if (inputValue.length >= currentWord.length) {
                feedback.textContent = "❌ 错误！正确答案是: " + currentWord;
                feedback.className = "feedback wrong";
                wrongCount++;
                setTimeout(() => {
                    currentWordIndex++;
                    showCurrentWord();
                }, 1200);
            }
        }

        // 开始游戏
        function startGame() {
            isGameRunning = true;
            // 每次开始都重新随机抽取20个全新的单词
            shuffledWords = getRandomWords(PRACTICE_WORD_COUNT);
            currentWordIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            typingInput.disabled = false;
            startBtn.disabled = true;
            restartBtn.disabled = false;
            showCurrentWord();
        }

        // 结束游戏
        function endGame() {
            isGameRunning = false;
            typingInput.disabled = true;
            wordDisplay.textContent = "🎉 练习完成！";
            phoneticDisplay.textContent = "";
            translationDisplay.textContent = `正确率: ${Math.round((correctCount / shuffledWords.length) * 100)}%`;
            exampleDisplay.textContent = `你一共完成了${shuffledWords.length}个单词的练习，正确${correctCount}个，错误${wrongCount}个`;
            feedback.textContent = "";
            startBtn.disabled = false;
            restartBtn.disabled = false;
        }

        // 重新开始游戏
        function restartGame() {
            startGame();
        }

        // 事件监听
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', restartGame);
        typingInput.addEventListener('input', checkInput);

        // 阻止表单默认提交行为
        typingInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && isGameRunning) {
                checkInput();
            }
        });
    </script>
</body>
</html>
